<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinoInvest — Offline</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#0b1220;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
    .card{background:rgba(11,18,32,0.9);border:1px solid rgba(201,162,39,0.3);border-radius:16px;padding:40px 32px;max-width:400px;width:100%}
    .logo{font-size:48px;margin-bottom:16px}
    h1{font-size:22px;font-weight:800;color:#C9A227;margin-bottom:8px}
    p{color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:24px}
    button{padding:12px 24px;border-radius:8px;background:linear-gradient(135deg,#C9A227,#a07d1a);border:none;color:#0b1220;font-weight:700;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🍷</div>
    <h1>Sei offline</h1>
    <p>VinoInvest non è disponibile senza connessione internet. Riconnettiti per accedere al mercato, al portfolio e all'AI Advisor.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
