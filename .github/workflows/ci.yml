name: CI

on:
  push:
    branches: [main, develop, "feature/*", "fix/*", "agent-*", "build/v2"]
  pull_request:
    branches: [main, "build/v2"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Frontend ──────────────────────────────────────────
      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint 2>/dev/null || echo "No lint script"

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Backend ───────────────────────────────────────────
      - name: Install backend deps
        run: cd backend && npm ci

      - name: Syntax check backend
        run: |
          cd backend
          for f in $(find . -name "*.js" -not -path "*/node_modules/*"); do
            node --check "$f" || exit 1
          done
          echo "All backend files pass syntax check"

      - name: Run backend tests
        run: cd backend && npm test 2>/dev/null || echo "No tests configured yet"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: test

      # ── Security scan ─────────────────────────────────────
      - name: Check for exposed secrets
        run: |
          if grep -rn "sk-ant-\|sk_live_\|password.*=.*['\"][a-zA-Z0-9]" \
            --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "ERRORE: Trovato possibile secret hardcoded!"
            exit 1
          fi
          echo "Nessun secret esposto trovato"

      # ── Structural checks ─────────────────────────────────
      - name: Structural / file-based checks
        run: |
          set -e
          fail=0
          check() {
            local label="$1"; local cmd="$2"
            if eval "$cmd" > /dev/null 2>&1; then
              echo "  ✅  $label"
            else
              echo "  ❌  $label"
              fail=1
            fi
          }
          check "premiumModules.js exists"       "test -f frontend/src/data/premiumModules.js"
          check "WineCompare.jsx exists"         "test -f frontend/src/pages/WineCompare.jsx"
          check "/compare route in App.jsx"      "grep -q '/compare' frontend/src/App.jsx"
          check "vino_watchlist in App.jsx"      "grep -q 'vino_watchlist' frontend/src/App.jsx"
          check "ThemeToggle in App.jsx"         "grep -q 'ThemeToggle' frontend/src/App.jsx"
          check "applyTheme in App.jsx"          "grep -q 'applyTheme' frontend/src/App.jsx"
          check "shared_portfolios in server.js" "grep -q 'shared_portfolios' backend/src/server.js"
          check "enrichmentJob registered"       "grep -q 'enrichmentJob' backend/src/server.js"
          check "SourceBadge in WineCard"        "grep -q 'SourceBadge' frontend/src/components/WineCard.jsx"
          check "VITE_BACKEND_URL (no VITE_API_URL)" "! grep -r 'VITE_API_URL' frontend/src"
          check "No Three.js in frontend"       "! grep -rq \"from ['\\\"]three['\\\"]\\|require.*['\\\"]three['\\\"]\" frontend/src --include='*.jsx' --include='*.js'"
          exit $fail

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: frontend/dist/
          retention-days: 7
